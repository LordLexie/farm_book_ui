<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  @if (data.subtitle) {
    <p class="subtitle">{{ data.subtitle }}</p>
  }
  @if (errorMessage()) {
    <div class="error-banner">{{ errorMessage() }}</div>
  }

  <form [formGroup]="form" class="form-grid">
    <mat-form-field appearance="outline">
      <mat-label>Date</mat-label>
      <input matInput type="date" formControlName="date" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Vehicle</mat-label>
      <input matInput formControlName="vehicle_reg" placeholder="e.g. KDA 123A" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Delivered by (driver)</mat-label>
      <input matInput formControlName="delivered_by" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Contact person</mat-label>
      <input matInput formControlName="contact_person" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Contact phone</mat-label>
      <input matInput formControlName="contact_phone" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Delivery address</mat-label>
      <textarea matInput formControlName="delivery_address" rows="2" placeholder="Where the goods should be delivered"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Notes</mat-label>
      <textarea matInput formControlName="notes" rows="3" placeholder="Optional delivery instructions…"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-flat-button color="primary" [disabled]="form.invalid || isSaving()" (click)="submit()">
    @if (isSaving()) {
      <mat-spinner diameter="18" />
    } @else {
      {{ data.submitLabel }}
    }
  </button>
</mat-dialog-actions>
